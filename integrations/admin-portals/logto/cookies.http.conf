# http context. Preserve opaque native cookie values, including embedded equals signs.

map $http_cookie $logto_interaction {
    default "";
    "~(?:^|;)[[:blank:]]*(_interaction=[^;]+)" "; $1";
}

map $http_cookie $logto_interaction_sig {
    default "";
    "~(?:^|;)[[:blank:]]*(_interaction[.]sig=[^;]+)" "; $1";
}

map $http_cookie $logto_interaction_resume {
    default "";
    "~(?:^|;)[[:blank:]]*(_interaction_resume=[^;]+)" "; $1";
}

map $http_cookie $logto_interaction_resume_sig {
    default "";
    "~(?:^|;)[[:blank:]]*(_interaction_resume[.]sig=[^;]+)" "; $1";
}

map $http_cookie $logto_session {
    default "";
    "~(?:^|;)[[:blank:]]*(_session=[^;]+)" "; $1";
}

map $http_cookie $logto_session_sig {
    default "";
    "~(?:^|;)[[:blank:]]*(_session[.]sig=[^;]+)" "; $1";
}

map $http_cookie $logto_logto {
    default "";
    "~(?:^|;)[[:blank:]]*(_logto=[^;]+)" "; $1";
}

map $http_cookie $logto_logto_sig {
    default "";
    "~(?:^|;)[[:blank:]]*(_logto[.]sig=[^;]+)" "; $1";
}

map "$logto_interaction$logto_interaction_sig$logto_interaction_resume$logto_interaction_resume_sig$logto_session$logto_session_sig$logto_logto$logto_logto_sig" $logto_native_cookie {
    default "";
    "~^; (.+)$" $1;
}

# Management, account and /me APIs accept the signed-in user's native bearer.
map $http_authorization $logto_bearer {
    default "";
    "~^Bearer [A-Za-z0-9._~-]+$" $http_authorization;
}
