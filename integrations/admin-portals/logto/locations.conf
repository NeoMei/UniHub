# The parent TLS server includes common.conf with location = /auth/callback.
location = /auth {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    include logto/proxy.inc;
}
location ^~ /auth/ {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    include logto/proxy.inc;
}
location ^~ /auth/management/api/ {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    include logto/management.inc;
    proxy_pass http://127.0.0.1:13004/api/;
}
location = /auth/management/oidc/.well-known/openid-configuration {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    include logto/management.inc;
    proxy_pass http://127.0.0.1:13004/oidc/.well-known/openid-configuration;
}
