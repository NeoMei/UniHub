# Inside the TLS server for unihub.quukk.com, alongside its private /internal/ block.
location = /_unihub_operator {
    internal;
    proxy_pass http://127.0.0.1:14000/internal/portals/operator;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "unihub_session=$cookie_unihub_session";
}

location @unihub_portal_login {
    rewrite ^ /internal/portals/login break;
    proxy_pass http://127.0.0.1:14000;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
}

# The UniHub OIDC client owns this exact callback, including its query string.
location = /auth/callback {
    proxy_pass http://127.0.0.1:14000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
