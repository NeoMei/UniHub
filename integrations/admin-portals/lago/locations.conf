# Include inside the unihub.quukk.com TLS server, next to common.conf.
# Mount stage/ at /srv/unihub-admin-portals/paylab; no Lago container change.
location = /paylab {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    # try_files runs after the access phase. An immediate return would skip auth.
    try_files "" @lago_paylab_slash;
}

location @lago_paylab_slash {
    absolute_redirect off;
    return 308 /paylab/$is_args$args;
}

location = /paylab/api/graphql {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    try_files "" @lago_paylab_graphql;
}

# Named targets run after the operator check; they cannot be reached by URL.
location @lago_paylab_graphql {
    if ($request_method != POST) { return 405; }
    if ($http_origin != "https://unihub.quukk.com") { return 403; }
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Lago-Organization $http_x_lago_organization;
    proxy_set_header Customer-Portal-Token $http_customer_portal_token;
    proxy_set_header Content-Type $http_content_type;
    proxy_hide_header Set-Cookie;
    rewrite ^ /graphql break;
    proxy_pass http://127.0.0.1:18781;
}

location = /paylab/api/cable {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    try_files "" @lago_paylab_cable;
}

# Named targets run after the operator check; they cannot be reached by URL.
location @lago_paylab_cable {
    if ($request_method != GET) { return 405; }
    if ($http_origin != "https://unihub.quukk.com") { return 403; }
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_pass_request_headers off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
    proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 3600s;
    rewrite ^ /cable break;
    proxy_pass http://127.0.0.1:18781;
}

location ^~ /paylab/api/ {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    try_files "" =404;
}

location = /paylab/env-config.js {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    limit_except GET { deny all; }
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_pass_request_headers off;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    expires -1;
    # Public frontend configuration from the existing native image (locale, OAuth, flags).
    proxy_pass http://127.0.0.1:18780/env-config.js;
}

location ^~ /paylab/ {
    auth_request /_unihub_operator;
    error_page 401 = @unihub_portal_login;
    limit_except GET { deny all; }
    root /srv/unihub-admin-portals;
    # The HTML and all assets stay private. Preserve Lago script/worker restrictions
    # and use the UniHub top-level document's stricter framing and referrer policies.
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    try_files /paylab/index.html =404;

    location ^~ /paylab/assets/ {
        auth_request /_unihub_operator;
        error_page 401 = @unihub_portal_login;
        try_files $uri =404;
    }

    location = /paylab/favicon-prod.svg {
        auth_request /_unihub_operator;
        error_page 401 = @unihub_portal_login;
        try_files $uri =404;
    }
}
