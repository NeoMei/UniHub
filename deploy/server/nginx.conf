log_format unihub_server '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# Only this hostname is added. Public :443 forwards to this server's :8484.
server {
    listen 80;
    server_name unihub.quukk.com;
    access_log /var/log/nginx/unihub-access.log unihub_server;
    # Upstream error logs otherwise include full callback query strings.
    error_log /dev/null crit;
    # HTTPS-only: close this hostname's HTTP connection without redirecting.
    return 444;
}

server {
    listen 8484 ssl;
    server_name unihub.quukk.com;
    access_log /var/log/nginx/unihub-access.log unihub_server;
    # Upstream error logs otherwise include full callback query strings.
    error_log /dev/null crit;
    ssl_certificate /etc/nginx/ssl/_.quukk.com_chain.pem;
    ssl_certificate_key /etc/nginx/ssl/_.quukk.com_key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;

    # Deliberately no Go CSP here: Casdoor requires its own inline scripts.
    # Casdoor uses HTTP internally; Beego otherwise omits Secure on its cookie.
    proxy_cookie_flags casdoor_session_id secure httponly samesite=lax;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /assets/unihub-logo-v1.png { proxy_pass http://127.0.0.1:8088; }
    location = /assets/unihub-icon-v1.png { proxy_pass http://127.0.0.1:8088; }
    location = /login { proxy_pass http://127.0.0.1:58000; }
    location ^~ /login/ { proxy_pass http://127.0.0.1:58000; }
    # Canonical Casdoor administration pages need direct-load/refresh routing.
    location = /users { proxy_pass http://127.0.0.1:58000; }
    location ^~ /users/ { proxy_pass http://127.0.0.1:58000; }
    location = /organizations { proxy_pass http://127.0.0.1:58000; }
    location ^~ /organizations/ { proxy_pass http://127.0.0.1:58000; }
    location = /applications { proxy_pass http://127.0.0.1:58000; }
    location ^~ /applications/ { proxy_pass http://127.0.0.1:58000; }
    # Initial server enrollment is closed for every Casdoor application.
    location = /api/signup { return 403; }
    location ^~ /api/signup/ { return 403; }
    location = /api { proxy_pass http://127.0.0.1:58000; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:58000; }
    location ^~ /.well-known/ { proxy_pass http://127.0.0.1:58000; }
    location = /swagger { proxy_pass http://127.0.0.1:58000; }
    location ^~ /swagger/ { proxy_pass http://127.0.0.1:58000; }
    location ^~ /assets/ { proxy_pass http://127.0.0.1:58000; }
    location = /consent { proxy_pass http://127.0.0.1:58000; }
    location ^~ /consent/ { proxy_pass http://127.0.0.1:58000; }
    location = /mfa { proxy_pass http://127.0.0.1:58000; }
    location ^~ /mfa/ { proxy_pass http://127.0.0.1:58000; }
    location = /forget { proxy_pass http://127.0.0.1:58000; }
    location ^~ /forget/ { proxy_pass http://127.0.0.1:58000; }
    location = /update-password { proxy_pass http://127.0.0.1:58000; }
    location ^~ /update-password/ { proxy_pass http://127.0.0.1:58000; }
    location = /result { proxy_pass http://127.0.0.1:58000; }
    location ^~ /result/ { proxy_pass http://127.0.0.1:58000; }
    location = /prompt { proxy_pass http://127.0.0.1:58000; }
    location ^~ /prompt/ { proxy_pass http://127.0.0.1:58000; }
    location ^~ /auth/ { proxy_pass http://127.0.0.1:8088; }
    location ^~ /v1/ { proxy_pass http://127.0.0.1:8088; }
    location ^~ /console-assets/ { proxy_pass http://127.0.0.1:8088; }
    location / { proxy_pass http://127.0.0.1:8088; }
}
