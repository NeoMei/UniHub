name: UniHub v2 CI

on:
  push:
    branches: [v2/main]
  pull_request:
    branches: [v2/main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: unihub
          POSTGRES_PASSWORD: unihub_test_password
          POSTGRES_DB: unihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run PostgreSQL integration tests
        env:
          UNIHUB_TEST_DATABASE_URL: postgresql://unihub:unihub_test_password@127.0.0.1:5432/unihub_test
        run: npm test
