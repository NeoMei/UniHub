<head>

  <link rel="icon" href="./assets/unihub-icon-v1.png" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --background: #F3F8FA;
      --sidebar: #FFFFFF;
      --card: #FFFFFF;
      --content: #F3F8FA;
      --border: #DEE8EC;
      --card-border: #DEE8EC;
      --foreground: #142B35;
      --muted-foreground: #6C8290;
      --primary: #087F8C;
      --primary-foreground: #FFFFFF;
      --mint: #35C4A3;
      --secondary: #FFFFFF;
      --secondary-foreground: #142B35;
      --link: #087F8C;
      --success: #15803d;
      --warning: #b45309;
      --error: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0D191F;
        --sidebar: #112028;
        --card: #142630;
        --content: #182D38;
        --border: #233D4B;
        --card-border: #233D4B;
        --foreground: #EAF4F7;
        --muted-foreground: #93ADB9;
        --primary: #1FA2B0;
        --primary-foreground: #07191C;
        --mint: #35C4A3;
        --secondary: #182D38;
        --secondary-foreground: #EAF4F7;
        --link: #35C4A3;
        --success: #4ade80;
        --warning: #fbbf24;
        --error: #f87171;
      }
      .brand-logo-img {
        background: #F3F8FA;
        border-radius: 8px;
        padding: 4px 6px;
        box-sizing: border-box;
      }
    }
    body {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }
    .nav-active {
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--primary);
      border-color: color-mix(in srgb, var(--primary) 35%, transparent);
    }
    .subtab-active {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .badge-primary, .badge-success, .badge-warning, .badge-error, .badge-muted {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-primary {
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--primary);
    }
    .badge-success {
      background: color-mix(in srgb, var(--success) 14%, transparent);
      color: var(--success);
    }
    .badge-warning {
      background: color-mix(in srgb, var(--warning) 16%, transparent);
      color: var(--warning);
    }
    .badge-error {
      background: color-mix(in srgb, var(--error) 14%, transparent);
      color: var(--error);
    }
    .badge-muted {
      background: var(--content);
      color: var(--muted-foreground);
    }
    .card-surface {
      background: var(--card);
      border: 1px solid var(--card-border);
    }
    .soft-surface {
      background: var(--content);
      border: 1px solid var(--border);
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-secondary {
      background: var(--secondary);
      color: var(--secondary-foreground);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { opacity: 0.88; }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-0">
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Prototype Scenario Bar -->
    <div class="border-b border-[var(--border)] bg-[var(--content)] px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex flex-wrap items-center gap-2">
        <span class="badge-primary px-2 py-0.5 rounded font-semibold">归一（UniHub）官方品牌原型</span>
        <span class="text-[var(--muted-foreground)]">场景切换：</span>
        <button id="btn-scene-site" class="scene-btn px-2.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] cursor-pointer">产品官网（主页/手册/品牌/关于）</button>
        <button id="btn-scene-console" class="scene-btn px-2.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] cursor-pointer">控制台</button>
        <button id="btn-scene-handoff" class="scene-btn px-2.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] cursor-pointer">应用跳入收银台</button>
        <button id="btn-scene-login" class="scene-btn px-2.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] cursor-pointer">登录壳</button>
        <button id="toggle-arrears-btn" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] cursor-pointer">
          欠款冻结：<strong id="arrears-state-label">正常</strong>
        </button>
      </div>
      <div class="flex items-center gap-2">
        <div class="inline-flex rounded-lg border border-[var(--border)] bg-[var(--card)] p-0.5">
          <button data-mode="portal" class="mode-btn px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer">用户 / 企业门户</button>
          <button data-mode="admin" class="mode-btn px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer">平台运营后台</button>
        </div>
      </div>
    </div>

    <div id="view-root" class="flex-1 flex flex-col"></div>
  </div>

  <div id="modal-root" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.48);">

      const units = rawUnits ?? Math.round(Math.abs(val) * 1_000_000);
      if (state.creditDisplayMode === 'units') return `<span title="账本原始精度">${val < 0 ? '-' : ''}${units.toLocaleString()} 单位</span>`;

      const display = (abs > 0 && abs < 0.01) ? Number(val).toFixed(4) : Number(val).toFixed(2);
      return `<span title="原账本值: ${units.toLocaleString()} 单位（百万分之一积分）" class="underline decoration-dotted cursor-help">${display} 积分</span>`;

          const granularityOk = !r.enabled || minLedgerUnits > 0;

    function validateRedirectUri(value) {
      const loopback = new Set(['localhost', '127.0.0.1', '[::1]']);
      if (typeof value !== 'string' || !value || value.length > 1024 || /[\s\u0000-\u001f\u007f\\#]/u.test(value) || !/^https?:\/\//i.test(value)) {
        return { ok: false, reason: '必须为合法 http(s) URL，且不能包含空格、反斜杠或 # 片段' };
      }
      try {
        const u = new URL(value);
        if (!(u.protocol === 'https:' || (u.protocol === 'http:' && loopback.has(u.hostname)))) {
          return { ok: false, reason: '仅允许 HTTPS，或本机回环 HTTP (localhost / 127.0.0.1 / [::1])' };
        }
        if (u.username || u.password) return { ok: false, reason: '禁止在回调 URL 中包含用户名或密码' };
        if (u.searchParams.has('code') || u.searchParams.has('state')) return { ok: false, reason: '禁止预设 code 或 state 查询参数' };
        return { ok: true };
      } catch {
        return { ok: false, reason: 'URL 格式解析失败' };
      }
    }

          </div>
          <div><label class="block text-[var(--muted-foreground)] mb-1">在途预扣占用基础积分</label><input id="calc-inflight" type="number" min="0" max="1000" value="200" class="w-full card-surface rounded px-2.5 py-1.5 mono" /></div>
          <div id="calc-result" class="card-surface rounded-xl p-4 space-y-1.5"></div>
        </div>
      `);
      const recalc = () => {
        const preset = document.getElementById('calc-preset').value;
        const U = Math.max(0, Math.min(2000, Number(document.getElementById('calc-used').value) || 0));
        const inflight = Math.max(0, Math.min(2000 - U, Number(document.getElementById('calc-inflight').value) || 0));
        const B = 2000, C = preset === 'yearly' ? 672 : 99, P = preset === 'yearly' ? 56 : 99, F = preset === 'yearly' ? 560 : 0;
        const imm = Math.min(C, F + Math.floor((P * Math.max(0, B - (U + inflight))) / B));
        const fin = Math.min(C, F + Math.floor((P * Math.max(0, B - U)) / B));
        document.getElementById('calc-result').innerHTML = `<div class="flex justify-between"><span>升级确认立即返还钱包</span><span class="mono font-bold text-[var(--primary)]">¥${imm}</span></div><div class="flex justify-between"><span>在途预扣释放后终结补返</span><span class="mono font-bold text-[var(--success)]">+¥${fin - imm}（累计 ¥${fin}）</span></div>`;
      };
      document.getElementById('calc-preset').onchange = recalc;

      document.getElementById('calc-inflight').oninput = recalc;
      recalc();
    }

            `server {\n  listen 443 ssl http2;\n  server_name ${hostOf(cfg.portalOrigin)};\n  location / {\n    proxy_pass http://127.0.0.1:14000; # UniHub 业务后端\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-Proto $scheme;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n  }\n}\n\n` +
            `server {\n  listen 443 ssl http2;\n  server_name ${hostOf(cfg.logto.issuer)};\n  location / {\n    proxy_pass http://10.0.10.12:3001; # Logto OSS\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-Proto $scheme;\n  }\n}\n\n` +
            `server {\n  listen 443 ssl http2;\n  server_name ${hostOf(cfg.llmrouter.publicOrigin)};\n  client_max_body_size 50m;\n  location /v1/ {\n    proxy_pass http://10.0.10.20:3000; # 新 LLMRouter 数据面\n    proxy_http_version 1.1;\n    proxy_set_header Connection "";\n    proxy_buffering off;\n    proxy_cache off;\n    proxy_read_timeout 300s;\n  }\n  location / { return 404; } # 屏蔽管理后台，仅放行已登记模型数据面\n}`;
          openModal(`
            <div class="flex items-center justify-between border-b border-[var(--card-border)] pb-3"><h2 class="text-base font-bold">Nginx 品牌反代配置参考模板 (${state.region.toUpperCase()})</h2><button onclick="closeModal()" class="text-xs text-[var(--muted-foreground)] hover:underline cursor-pointer">关闭</button></div>
            <div class="space-y-3 text-xs">
              <div class="text-[var(--muted-foreground)]">按当前子系统对接配置自动生成：分离门户、Logto 登录入口与 LLMRouter 数据面，自动关闭 SSE 缓冲并拦截公网管理路径。</div>
              <pre class="soft-surface rounded-xl p-3.5 mono overflow-x-auto leading-relaxed">${snippet.replace(/</g, '&lt;')}</pre>
              <div class="flex justify-end gap-2"><button class="btn-secondary px-3 py-1.5 rounded-lg cursor-pointer" onclick="showToast('已复制 Nginx 模板')">复制配置</button><button onclick="closeModal()" class="btn-primary px-4 py-1.5 rounded-lg cursor-pointer">关闭</button></div>
            </div>
          `);
        };
      }
    }

    document.getElementById('btn-scene-site').onclick = () => { state.scene = 'site'; state.sitePage = 'home'; render(); };
    document.getElementById('btn-scene-console').onclick = () => { state.scene = 'console'; render(); };
    document.getElementById('btn-scene-handoff').onclick = () => { state.scene = 'handoff'; state.handoffStep = 'checkout'; render(); };
    document.getElementById('btn-scene-login').onclick = () => { state.scene = 'login'; render(); };
    document.getElementById('toggle-arrears-btn').onclick = () => { state.arrearsFrozen = !state.arrearsFrozen; render(); };
    document.querySelectorAll('.mode-btn').forEach((b) => {
      b.onclick = () => {
        state.scene = 'console';
        state.mode = b.dataset.mode;
        state.section = state.mode === 'admin' ? (state.adminRole === 'app_operator' ? 'admin-products' : 'admin-overview') : 'overview';
        render();
      };
    });

    render();
  </script>
</body>
</html>
