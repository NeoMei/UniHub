name: unihub

services:
  postgres:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    container_name: unihub-dev-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:55438:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Run make dev-setup first}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run make dev-setup first}
      POSTGRES_DB: unihub
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d unihub"]
      interval: 3s
      timeout: 3s
      retries: 20

  ledger:
    image: ghcr.io/formancehq/ledger:v2.4.16@sha256:fc624af4dde0b9fa8b43ae02b7297fc3f15266df7c9806edec794f1420b40e62
    container_name: unihub-dev-ledger
    restart: unless-stopped
    command: ["serve", "--worker"]
    ports:
      - "127.0.0.1:53068:3068"
    environment:
      POSTGRES_URI: ${LEDGER_POSTGRES_URI:?Run make dev-setup first}
      AUTO_UPGRADE: "true"
      OTEL_SERVICE_NAME: unihub-ledger
    networks: [dev]
    depends_on:
      postgres:
        condition: service_healthy

  casdoor:
    image: casbin/casdoor:v4.23.0@sha256:e13c9aada231f7338a03ab0ae7054d0a9480e77283338ab9fc319d88fe2b3ce0
    container_name: unihub-dev-casdoor
    restart: unless-stopped
    ports:
      - "127.0.0.1:58000:8000"
    # The image runs as uid 1000; supplemental group permits reading the
    # generated config without making secret files world-readable.
    group_add: ["${LOCAL_GID:?Run make dev-setup first}"]
    volumes:
      - ./.local/casdoor/conf:/conf:ro
      # Reproducible UniHub UI overlay, prepared from the pinned image.
      - ./.local/casdoor/web:/web/build:ro
      - casdoor-logs:/logs
    networks: [dev]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

networks:
  dev:
    name: unihub-dev
    external: true

volumes:
  postgres:
    name: unihub-dev-postgres
    external: true
  casdoor-logs:
    name: unihub-dev-casdoor-logs
