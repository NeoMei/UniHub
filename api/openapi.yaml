  "/admin/v1/transfers":
    "post":
      "operationId": "createAdminTransfer"
      "summary": "createAdminTransfer"
      "description": "Console-only conserved cross-account cash transfer for a platform super_admin. Debits the operator's own personal unified wallet and credits an arbitrary target account's unified wallet or a named product wallet; never mints from world and never uses the manual-recharge path. The destination account must be a live account. Gate: the central console wrapper rejects any product origin, and admins:manage (held only by super_admin, not finance_admin) is re-checked inside the posting transaction. Requires CSRF and an Idempotency-Key. The audited posting is applied asynchronously by the wallet worker with kind admin_transfer; poll GET /v1/accounts/{account}/operations/{operation} for APPLIED."
      "security":
        -
          "BearerAuth": []
      "responses":
        "202":
          "description": "Conserved transfer queued"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Operation"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
      "parameters":
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "account_id":
                  "type": "string"
                  "description": "Destination account id; may be any account, including a team or personal account."
                "product_id":
                  "type": "string"
                  "description": "Empty credits the target unified wallet; a product id credits that product wallet."
                "amount":
                  "$ref": "#/components/schemas/IntegerString"
                "reason":
                  "type": "string"
                  "description": "Operator reason attached by the admin form; accepted but not persisted."
              "required":
                - "account_id"
                - "amount"
              "additionalProperties": false
  "/v1/accounts/{account}/member-transfers":
    "post":
      "operationId": "createMemberTransfer"
      "summary": "createMemberTransfer"
      "description": "Console-only conserved transfer for a team owner to one of its own members. {account} must be a team owned by the caller; the target user_id must be a member of that team. Debits the owner's own personal unified wallet and credits the selected member's personal unified wallet or a named product wallet; the team shared wallet is neither source nor destination. Gate is re-checked inside the posting transaction. Deliberately absent from product-token scopes, so a product token gets 403. Requires CSRF and an Idempotency-Key. Posted asynchronously with kind admin_transfer; poll GET /v1/accounts/{account}/operations/{operation} for APPLIED."
      "security":
        -
          "BearerAuth": []
      "responses":
        "202":
          "description": "Conserved member transfer queued"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Operation"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
      "parameters":
        -
          "name": "account"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
          "description": "Team account id; the caller must be its owner."
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "user_id":
                  "type": "string"
                  "description": "Destination member user id; must be a member of the team."
                "product_id":
                  "type": "string"
                  "description": "Empty credits the member's unified wallet; a product id credits that product wallet."
                "amount":
                  "$ref": "#/components/schemas/IntegerString"
              "required":
                - "user_id"
                - "amount"
              "additionalProperties": false
  "/admin/v1/overview/timeseries":
    "get":
      "operationId": "adminOverviewTimeseries"
      "summary": "adminOverviewTimeseries"
      "description": "Platform admin with system:read only. Returns the last 14 UTC days of daily new users, calls and failed calls, the pending refund queue and the top 5 models by failure rate over the last 7 days. Failed calls are terminal REJECTED/CANCELED outcomes; calls with unresolved billing commands report UNKNOWN and are excluded. Call, refund and model risk data additionally require finance:read; without it days stay zeroed for those series, top_failed_models is empty and finance_scope=false. All windows are fixed, parameterized, half-open UTC ranges."
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required": ["as_of", "timezone", "finance_scope", "days", "pending_refunds", "top_failed_models"]
                "properties":
                  "as_of": {"type": "string", "format": "date-time"}
                  "timezone": {"type": "string", "enum": ["UTC"]}
                  "finance_scope": {"type": "boolean", "description": "True when the caller has finance:read and call/refund/model data are populated."}
                  "days":
                    "type": "array"
                    "description": "Exactly 14 UTC day buckets, oldest first, current day last."
                    "items":
                      "type": "object"
                      "required": ["date", "new_users", "calls", "failed_calls"]
                      "properties":
                        "date": {"type": "string", "description": "UTC calendar day, YYYY-MM-DD."}
                        "new_users": {"type": "integer", "minimum": 0}
                        "calls": {"type": "integer", "minimum": 0, "description": "0 without finance:read."}
                        "failed_calls": {"type": "integer", "minimum": 0, "description": "Terminal REJECTED/CANCELED calls; UNKNOWN outcomes excluded."}
                  "pending_refunds": {"type": "integer", "minimum": 0, "description": "Orders with refund_status MANUAL_REVIEW; 0 without finance:read."}
                  "top_failed_models":
                    "type": "array"
                    "maxItems": 5
                    "description": "Models with at least one failed call in the last 7 days, highest failure rate first, ties broken by call count then model name."
                    "items":
                      "type": "object"
                      "required": ["model", "calls", "failed_calls", "failure_rate"]
                      "properties":
                        "model": {"type": "string"}
                        "calls": {"type": "integer", "minimum": 0}
                        "failed_calls": {"type": "integer", "minimum": 0}
                        "failure_rate": {"type": "number", "minimum": 0, "maximum": 1, "description": "failed_calls/calls rounded to 4 decimals."}
        "400": {"$ref": "#/components/responses/Error"}
        "401": {"$ref": "#/components/responses/Error"}
        "403": {"$ref": "#/components/responses/Error"}
        "503": {"$ref": "#/components/responses/Error"}
"components":
  "securitySchemes":
    "BearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "OIDC access token"
      "description": "Exact distinct client audience; console/ops/service audiences separate. Scope requirements are x-product-scopes registry upper bounds AND domain RBAC."
    "OperatorBearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "Operator OIDC access token"
      "description": "Distinct operator audience verified separately from product/console tokens. A write also requires the configured operator allowlist. Never embed an operator token in a product UI, configuration file or URL."
  "parameters":
    "IdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "minLength": 1
        "maxLength": 128
      "description": "Caller-generated stable key; preserve original key/result after ambiguity. Never automatically retry using a new key."
  "responses":
    "IdentityRateLimited":
      "description": "The currently observed rate limit resets after this many seconds. Later traffic can extend the wait."
      "headers":
        "Retry-After":
          "schema": {"type": "integer", "minimum": 1, "maximum": 900}
      "content":
        "application/json":
          "schema": {"$ref": "#/components/schemas/IdentityRateLimited"}
    "Error":
      "description": "Structured failure: 400 invalid_request/invalid_grant; 401 unauthenticated; 402 insufficient funds/credits; 403 forbidden; 404 unavailable object; 409 conflict/operation_pending/refund_requires_review/interaction_required/subscription_required/quote_invalidated; 429 rate_limited; 503 unavailable/payment_not_configured/authorization_result_unknown. quote_invalidated is a pre-order, pre-payment upgrade rejection only. Uncertainty is not success."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
  "schemas":
    "Checkout": {"type": "object", "properties": {"id": {"type": "string"}, "account_id": {"type": "string"}, "product_id": {"type": "string"}, "provider": {"type": "string"}, "offer_name": {"type": "string"}, "currency": {"type": "string"}, "order_id": {"type": "string"}, "error_code": {"type": "string"}, "amount": {"$ref": "#/components/schemas/IntegerString"}, "payment_status": {"enum": ["CREATED", "PENDING", "UNKNOWN", "PAID", "CLOSED", "REVIEW"]}, "fulfillment_status": {"enum": ["NOT_STARTED", "PENDING", "FULFILLED", "REVIEW"]}, "refund_status": {"enum": ["PENDING", "SUCCEEDED", "REVIEW"]}, "created_at": {"type": "string", "format": "date-time"}, "expires_at": {"type": "string", "format": "date-time"}, "session": {"type": "object", "properties": {"kind": {"enum": ["qr", "redirect"]}, "url": {"type": "string"}, "expires_at": {"type": "string", "format": "date-time"}}, "required": ["kind", "url", "expires_at"]}}, "required": ["id", "account_id", "product_id", "provider", "offer_name", "amount", "currency", "payment_status", "fulfillment_status", "expires_at", "created_at"]}
    "ScopedModel":
      "type": "object"
      "additionalProperties": false
      "required": ["id", "name", "operations", "input_modalities", "output_modalities", "context", "max_output", "probe", "rate_id"]
      "properties":
        "capability_metadata": {"type":"object","description":"LLMRouter-owned model and operation capability metadata, preserved with its original field names."}
        "id": {"type": "string"}
        "name": {"type": "string"}
        "operations": {"type": "array", "items": {"type": "string"}}
        "input_modalities": {"type": "array", "items": {"type": "string"}}
        "output_modalities": {"type": "array", "items": {"type": "string"}}
        "context": {"type": "integer", "minimum": 0}
        "max_output": {"type": "integer", "minimum": 0}
        "probe": {"type": "boolean"}
        "rate_id": {"type": "string"}
    "ScopedModelList":
      "type": "object"
      "additionalProperties": false
      "required": ["object", "data"]
      "properties":
        "object": {"const": "list"}
        "data": {"type": "array", "items": {"$ref": "#/components/schemas/ScopedModel"}}
    "ModelDiscovery":
      "type": "object"
      "additionalProperties": false
      "required": ["account_id", "instance_id", "origin_product_id", "expires_at", "models"]
      "properties":
        "schema_version": {"type":"integer"}
        "catalog_version": {"type":"string"}
        "catalog_source": {"type":"string"}
        "model_scope": {"enum":["selected","llmrouter_available"]}
        "pricing_source": {"type":"string"}
        "native_credit_conversion": {"$ref":"#/components/schemas/NativeCreditConversion"}
        "credential_version": {"type":"integer","minimum":1}
        "account_id": {"type": "string"}
        "instance_id": {"type": "string"}
        "origin_product_id": {"type": "string"}
        "expires_at": {"type": "string", "format": "date-time"}
        "models": {"type": "array", "items": {"$ref": "#/components/schemas/ScopedModel"}}
    "ManagedAPIKeyRequest":
      "type": "object"
      "description": "Native llmrouter_available keys default to prepaid_cash when funding_mode is omitted. Explicit credits opts into CREDIT/6 and requires configured conversion/runtime support. Existing key assets are never converted by scope upgrades."
      "additionalProperties": false
      "required": ["name"]
      "oneOf": [{"required":["model_scope"],"properties":{"model_scope":{"const":"llmrouter_available"}}},{"required":["models"],"properties":{"model_scope":{"const":"selected"},"models":{"minItems":1,"maxItems":32}}}]
      "properties":
        "model_scope": {"enum":["selected","llmrouter_available"],"default":"selected"}
        "name": {"type":"string","minLength":1,"maxLength":128}
        "origin_product_id": {"type":"string"}
        "instance_id": {"type":"string","default":"default"}
        "models": {"type":"array","items":{"type":"string"},"description":"Finite permission set for selected scope; optional historical metadata for dynamic scope."}
        "funding_mode": {"$ref":"#/components/schemas/FundingMode"}
        "expires_at": {"type":"string","format":"date-time"}
        "max_total": {"type":"string","pattern":"^$|^(0|[1-9][0-9]{0,18})$"}
        "max_per_call": {"type":"string","pattern":"^$|^(0|[1-9][0-9]{0,18})$"}
    "ManagedAPIKeyScopeRequest":
      "type": "object"
      "additionalProperties": false
      "required": ["model_scope"]
      "properties":
        "model_scope": {"const":"llmrouter_available"}
        "origin_product_id": {"type":"string"}
        "instance_id": {"type":"string","default":"default"}
    "ManagedAPIKeyModelsRequest":
      "type": "object"
      "additionalProperties": false
      "required": ["models"]
      "properties":
        "origin_product_id": {"type":"string","description":"Required for console clients; product clients are bound by verified registry."}
        "instance_id": {"type":"string","default":"default"}
        "models": {"type":"array","minItems":1,"maxItems":32,"items":{"type":"string"}}
    "ManagedAPIKey":
      "type": "object"
      "properties":
