      "type": "object"
      "properties":
        "client_id":
          "type": "string"
        "username":
          "type": "string"
          "pattern": "^[a-z][a-z0-9_-]{1,63}$"
        "password":
          "type": "string"
          "format": "password"
          "minLength": 8
          "maxLength": 128
          "description": "At least 8 Unicode characters, UTF-8 total at most 72 bytes, with no control characters. Current organization rules apply."
          "writeOnly": true
        "email":
          "type": "string"
        "display_name":
          "type": "string"
          "maxLength": 80
      "required":
        - "client_id"
        - "username"
        - "password"
      "additionalProperties": false
