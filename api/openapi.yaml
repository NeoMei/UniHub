          "type": "string"
        "password":
          "type": "string"
          "format": "password"
          "writeOnly": true
      "required":
        - "client_id"
        - "redirect_uri"
        - "scope"
        - "state"
        - "nonce"
        - "code_challenge_method"
        - "code_challenge"
        - "username"
        - "password"
      "additionalProperties": false
