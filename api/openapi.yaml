"openapi": "3.1.0"
"info":
  "title": "UniHub Headless Product API"
  "version": "0.1.0"
  "description": "Product-owned JSON UI and backend integration. Each client has its own exact access-token audience and approved registry scopes/origins/callbacks/BillingProducts. Scopes are server registry policy, not OAuth token-scope claims. Amounts/counts/usage are integer strings; no implicit currency/credit conversion. Formance is authoritative. No automatic financial retries. API errors never expose provider credentials. Browser CORS exact registered origins; no Allow-Credentials; preflight permits only Authorization, Content-Type, Idempotency-Key. No public GET client configuration, refresh or server logout endpoint currently exists."
"servers":
  -
    "url": "http://127.0.0.1:8088"
    "description": "Local development; use deployment HTTPS service origin in production"
"security":
  -
    "BearerAuth": []
"paths":
  "/v1/identity/registrations":
    "post":
      "operationId": "registerIdentity"
      "summary": "registerIdentity"
      "description": "Requires explicitly enabled client registration. 202 UNKNOWN is unresolved, not registered. Repeat the SAME key and nonsecret metadata only to reconcile; never auto-create using a new key. Passwords go only to IdP and are never stored in UniHub."
      "security": []
      "responses":
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
        "200":
          "description": "Idempotent readback"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "202":
          "description": "Registration outcome UNKNOWN"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "parameters":
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegistrationRequest"
