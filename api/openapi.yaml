"openapi": "3.1.0"
"info":
  "title": "UniHub Headless Product API"
  "version": "0.4.48"
  "description": "Product-owned JSON UI and backend integration. Each client has its own exact access-token audience and approved registry scopes/origins/callbacks/BillingProducts. Scopes are server registry policy, not OAuth token-scope claims. Amounts/counts/usage are integer strings; no implicit currency/credit conversion. Formance is authoritative. No automatic financial retries. API errors never expose provider credentials. Browser CORS exact registered origins; no Allow-Credentials; preflight permits only Authorization, Content-Type, Idempotency-Key. Approved product clients may use one-use rotating refresh tokens; no public GET client configuration exists. Billing profiles compose subscriptions, credits, addons and prepaid CNY/6 usage per product. Product reads never permit commercial configuration writes; operator audience is separate. Mixed-asset summaries have no single charged total."
"servers":
  -
    "url": "http://127.0.0.1:8088"
    "description": "Local development; use deployment HTTPS service origin in production"
"security":
  -
    "BearerAuth": []
"paths":
  "/v1/accounts/{account}/checkouts": {"get": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Checkout"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}, "post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "responses": {"202": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {"offer_id": {"type": "string"}, "quote_id": {"type": "string"}, "provider": {"enum": ["wechat", "alipay"]}}, "required": ["provider"], "oneOf": [{"required": ["offer_id"], "not": {"required": ["quote_id"]}}, {"required": ["quote_id"], "not": {"required": ["offer_id"]}}]}}}}}}
  "/v1/accounts/{account}/checkouts/{checkout}": {"get": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}}
  "/v1/accounts/{account}/checkouts/{checkout}/reconcile": {"post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false}}}}}}
  "/v1/accounts/{account}/checkouts/{checkout}/close": {"post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false}}}}}}
  "/v1/accounts/{account}/checkouts/{checkout}/refund": {"post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "responses": {"202": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {"reason": {"type": "string", "minLength": 1, "maxLength": 80}}, "required": ["reason"]}}}}}}
  "/internal/v1/product-finance/accounts/{account}/checkouts": {"get": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available. Requires verified finance service token and X-UniHub-Actor-Authorization proof with existing orders/refunds scopes.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Checkout"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}, "post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available. Requires verified finance service token and X-UniHub-Actor-Authorization proof with existing orders/refunds scopes.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "responses": {"202": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {"offer_id": {"type": "string"}, "quote_id": {"type": "string"}, "provider": {"enum": ["wechat", "alipay"]}}, "required": ["provider"], "oneOf": [{"required": ["offer_id"], "not": {"required": ["quote_id"]}}, {"required": ["quote_id"], "not": {"required": ["offer_id"]}}]}}}}}}
  "/internal/v1/product-finance/accounts/{account}/checkouts/{checkout}": {"get": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available. Requires verified finance service token and X-UniHub-Actor-Authorization proof with existing orders/refunds scopes.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}}
  "/internal/v1/product-finance/accounts/{account}/checkouts/{checkout}/reconcile": {"post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available. Requires verified finance service token and X-UniHub-Actor-Authorization proof with existing orders/refunds scopes.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false}}}}}}
  "/internal/v1/product-finance/accounts/{account}/checkouts/{checkout}/close": {"post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available. Requires verified finance service token and X-UniHub-Actor-Authorization proof with existing orders/refunds scopes.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false}}}}}}
  "/internal/v1/product-finance/accounts/{account}/checkouts/{checkout}/refund": {"post": {"description": "Account finance role and product scope required. Read/reconcile/close retain the original provider order. UNKNOWN never permits a fresh charge. New commercial purchases are excluded while unresolved; model usage remains available. Requires verified finance service token and X-UniHub-Actor-Authorization proof with existing orders/refunds scopes.", "parameters": [{"name": "account", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "checkout", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 128}}], "responses": {"202": {"description": "Authoritative checkout state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Checkout"}}}}, "400": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {"reason": {"type": "string", "minLength": 1, "maxLength": 80}}, "required": ["reason"]}}}}}}
  "/payments/{provider}/notify": {"post": {"security": [], "description": "Provider-authenticated raw callback. Verifies merchant, signature, exact CNY amount, original order and unique transaction before durable receipt ACK. Return navigation is never payment evidence. Alipay ACK is literal success; WeChat ACK is code SUCCESS. Fulfillment/ledger failure recovers independently.", "parameters": [{"name": "provider", "in": "path", "required": true, "schema": {"enum": ["wechat", "alipay"]}}], "responses": {"200": {"description": "Verified receipt persisted"}, "400": {"description": "Invalid or unpersisted notification"}}}}
  "/v1/me/product-access":
    "get": {"operationId": "productAccess", "description": "Verified product access:read or console; product/instance derive from client policy.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductAccess"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "product_id", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "instance", "in": "query", "required": false, "schema": {"type": "string"}}]}
  "/v1/me/applications":
    "get": {"operationId": "applications", "description": "Available product launch URLs and current access; product clients see only their instance.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Application"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  "/v1/user-management":
    "get": {"operationId": "userManagement", "description": "Console identity only; immutable USER_ADMIN_IDS gate.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "object", "properties": {"enabled": {"type": "boolean"}, "can_manage": {"type": "boolean"}}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  "/v1/user-management/users":
    "get": {"operationId": "managedUsers", "description": "Configured user administrator only; bounded directory search.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ManagedUser"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "q", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]}
  "/v1/user-management/products":
    "get": {"operationId": "userProducts", "description": "Configured user administrator only; billing-independent manifests.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ProductManifest"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  "/v1/user-management/users/{user}/access":
    "get": {"operationId": "userAccess", "description": "Configured user administrator only; explicit assignment version distinct from manifest version.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ProductAssignment"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "user", "in": "path", "required": true, "schema": {"type": "string"}}]}
  "/v1/user-management/users/{user}/access/{product}":
    "put": {"operationId": "setUserAccess", "description": "Console administrator only; CSRF-protected browser write. Body version is assignment_version, initially 0; transaction/audit with stale version 409.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductAssignment"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "user", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "product", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "instance", "in": "query", "required": false, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["roles", "active", "version"], "additionalProperties": false, "properties": {"roles": {"type": "array", "items": {"type": "string"}}, "active": {"type": "boolean"}, "version": {"type": "integer", "minimum": 0}}}}}}}
  "/v1/user-management/users/{user}/status":
    "put": {"operationId": "setUserStatus", "description": "Console administrator only; global active status CAS. Refuses disabling last configured available user admin.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedUser"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "user", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["active", "version"], "additionalProperties": false, "properties": {"active": {"type": "boolean"}, "version": {"type": "integer", "minimum": 1}}}}}}}
  "/v1/identity/registrations":
    "post":
      "operationId": "registerIdentity"
      "summary": "registerIdentity"
      "description": "Requires explicitly enabled client registration. 202 UNKNOWN is unresolved, not registered. Repeat the SAME key and nonsecret metadata only to reconcile; never auto-create using a new key. Registration 429 includes Retry-After and retry_after seconds until the current hourly limit resets. registration_not_started=true applies only to this client/key at the server decision; it never clears a previously UNKNOWN result. Existing saved operations reconcile before rate limiting. Passwords go only to IdP and are never stored in UniHub."
      "security": []
      "responses":
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "400":
          "description": "Invalid request or password"
          "content":
            "application/json":
              "schema":
                "oneOf":
                  - "$ref": "#/components/schemas/Error"
                  - "$ref": "#/components/schemas/RegistrationPasswordError"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "description": "Registration attempt rejected before saving an operation for this client/key"
          "headers":
            "Retry-After":
              "description": "Remaining fixed-window wait in seconds, rounded up"
              "schema":
                "type": "integer"
                "minimum": 1
                "maximum": 3600
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationRateLimited"
        "503":
          "$ref": "#/components/responses/Error"
        "200":
          "description": "Idempotent readback"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "202":
          "description": "Registration outcome UNKNOWN"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "parameters":
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegistrationRequest"
  "/v1/identity/authorize/password":
    "post":
      "operationId": "authorizePassword"
      "summary": "authorizePassword"
      "description": "Product-owned JSON password authorization with S256/state/nonce. Exact registered client, callback and browser Origin. Interaction-required MFA/consent/policy returns 409, never bypassed."
      "security": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PasswordAuthorizeResult"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/IdentityRateLimited"
        "503":
          "$ref": "#/components/responses/Error"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PasswordAuthorizeRequest"
  "/v1/identity/authorize/mfa":
    "post":
      "operationId": "authorizeMfa"
      "summary": "authorizeMfa"
      "description": "Continues a password authorization that returned mfa_pending: one short-lived mfa_token plus the current TOTP passcode. Single-use, five-minute window with a five-attempt budget per token; browser Origin rules match password authorization."
      "security": []
      "responses":
        "200":
          "description": "Successful response; same binding as password authorization"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PasswordAuthorizeResult"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/IdentityRateLimited"
        "503":
          "$ref": "#/components/responses/Error"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/MfaAuthorizeRequest"
  "/v1/identity/token":
    "post":
      "operationId": "exchangeAuthorizationCode"
      "summary": "exchangeAuthorizationCode"
      "description": "Exchanges a single-use, five-minute authorization code or rotates a product refresh token. Authorization codes are bound to the exact client/redirect/code/verifier. Refresh tokens are returned only for approved clients, are opaque, one-use and rotated; replay revokes their family. Lost provider results return authorization_result_unknown; clients must not replay authorization codes."
      "security": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TokenSet"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/IdentityRateLimited"
        "503":
          "$ref": "#/components/responses/Error"
        "405":
          "$ref": "#/components/responses/Error"
