  "/admin/v1/overview/timeseries":
    "get":
      "operationId": "adminOverviewTimeseries"
      "summary": "adminOverviewTimeseries"
      "description": "Platform admin with system:read only. Returns the last 14 UTC days of daily new users, calls and failed calls, the pending refund queue and the top 5 models by failure rate over the last 7 days. Failed calls are terminal REJECTED/CANCELED outcomes; calls with unresolved billing commands report UNKNOWN and are excluded. Call, refund and model risk data additionally require finance:read; without it days stay zeroed for those series, top_failed_models is empty and finance_scope=false. All windows are fixed, parameterized, half-open UTC ranges."
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "required": ["as_of", "timezone", "finance_scope", "days", "pending_refunds", "top_failed_models"]
                "properties":
                  "as_of": {"type": "string", "format": "date-time"}
                  "timezone": {"type": "string", "enum": ["UTC"]}
                  "finance_scope": {"type": "boolean", "description": "True when the caller has finance:read and call/refund/model data are populated."}
                  "days":
                    "type": "array"
                    "description": "Exactly 14 UTC day buckets, oldest first, current day last."
                    "items":
                      "type": "object"
                      "required": ["date", "new_users", "calls", "failed_calls"]
                      "properties":
                        "date": {"type": "string", "description": "UTC calendar day, YYYY-MM-DD."}
                        "new_users": {"type": "integer", "minimum": 0}
                        "calls": {"type": "integer", "minimum": 0, "description": "0 without finance:read."}
                        "failed_calls": {"type": "integer", "minimum": 0, "description": "Terminal REJECTED/CANCELED calls; UNKNOWN outcomes excluded."}
                  "pending_refunds": {"type": "integer", "minimum": 0, "description": "Orders with refund_status MANUAL_REVIEW; 0 without finance:read."}
                  "top_failed_models":
                    "type": "array"
                    "maxItems": 5
                    "description": "Models with at least one failed call in the last 7 days, highest failure rate first, ties broken by call count then model name."
                    "items":
                      "type": "object"
                      "required": ["model", "calls", "failed_calls", "failure_rate"]
                      "properties":
                        "model": {"type": "string"}
                        "calls": {"type": "integer", "minimum": 0}
                        "failed_calls": {"type": "integer", "minimum": 0}
                        "failure_rate": {"type": "number", "minimum": 0, "maximum": 1, "description": "failed_calls/calls rounded to 4 decimals."}
        "400": {"$ref": "#/components/responses/Error"}
        "401": {"$ref": "#/components/responses/Error"}
        "403": {"$ref": "#/components/responses/Error"}
        "503": {"$ref": "#/components/responses/Error"}
"components":
  "securitySchemes":
    "BearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "OIDC access token"
      "description": "Exact distinct client audience; console/ops/service audiences separate. Scope requirements are x-product-scopes registry upper bounds AND domain RBAC."
    "OperatorBearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "Operator OIDC access token"
      "description": "Distinct operator audience verified separately from product/console tokens. A write also requires the configured operator allowlist. Never embed an operator token in a product UI, configuration file or URL."
  "parameters":
    "IdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "minLength": 1
        "maxLength": 128
      "description": "Caller-generated stable key; preserve original key/result after ambiguity. Never automatically retry using a new key."
  "responses":
    "Error":
      "description": "Structured failure: 400 invalid_request/invalid_grant; 401 unauthenticated; 402 insufficient funds/credits; 403 forbidden; 404 unavailable object; 409 conflict/operation_pending/refund_requires_review/interaction_required; 429 rate_limited; 503 unavailable/payment_not_configured/authorization_result_unknown. Uncertainty is not success."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
  "schemas":
    "ManagedAPIKeyRequest":
      "type": "object"
      "additionalProperties": false
      "required": ["name","models"]
      "properties":
        "name": {"type":"string","minLength":1,"maxLength":128}
        "origin_product_id": {"type":"string"}
        "instance_id": {"type":"string","default":"default"}
        "models": {"type":"array","minItems":1,"maxItems":32,"items":{"type":"string"}}
        "funding_mode": {"$ref":"#/components/schemas/FundingMode"}
        "expires_at": {"type":"string","format":"date-time"}
        "max_total": {"type":"string","pattern":"^$|^(0|[1-9][0-9]{0,18})$"}
        "max_per_call": {"type":"string","pattern":"^$|^(0|[1-9][0-9]{0,18})$"}
    "ManagedAPIKey":
      "type": "object"
      "properties":
        "id": {"type":"string"}
        "credential_kind": {"const":"api_key"}
        "name": {"type":"string"}
        "actor_id": {"type":"string"}
        "account_id": {"type":"string"}
        "origin_product_id": {"type":"string"}
        "instance_id": {"type":"string"}
        "models": {"type":"array","items":{"type":"string"}}
        "funding_mode": {"$ref":"#/components/schemas/FundingMode"}
        "asset": {"$ref":"#/components/schemas/BillingAsset"}
        "billing_profile_version": {"type":"integer"}
        "created_at": {"type":"string","format":"date-time"}
        "expires_at": {"type":["string","null"],"format":"date-time"}
        "revoked_at": {"type":["string","null"],"format":"date-time"}
        "max_total": {"type":"string"}
        "max_per_call": {"type":"string"}
        "held": {"type":"string"}
        "used": {"type":"string"}
        "remaining": {"type":["string","null"]}
    "UsageBudgetRequest":
      "type": "object"
      "additionalProperties": false
      "required": ["version"]
      "properties":
        "version": {"type":"integer","minimum":0}
        "max_total": {"type":"string","pattern":"^$|^(0|[1-9][0-9]{0,18})$"}
        "max_per_call": {"type":"string","pattern":"^$|^(0|[1-9][0-9]{0,18})$"}
    "UsageBudget":
      "type": "object"
      "properties":
        "version": {"type":"integer","minimum":0}
        "max_total": {"type":"string"}
        "max_per_call": {"type":"string"}
        "account_id": {"type":"string"}
        "origin_product_id": {"type":"string"}
        "instance_id": {"type":"string"}
        "funding_mode": {"$ref":"#/components/schemas/FundingMode"}
        "asset": {"$ref":"#/components/schemas/BillingAsset"}
        "held": {"type":"string"}
        "used": {"type":"string"}
        "remaining": {"type":["string","null"]}
    "IdentityProfile":
      "type": "object"
      "additionalProperties": false
      "required": ["id", "username", "display_name", "avatar_url", "email", "version"]
      "properties":
        "id": {"type": "string", "description": "Immutable UniHub user ID"}
        "username": {"type": "string", "description": "Fixed provider login name"}
        "display_name": {"type": "string", "maxLength": 80}
        "avatar_url": {"type": "string", "enum": ["", "/v1/me/avatar"]}
        "email": {"type": "string"}
        "version": {"type": "string", "description": "Opaque profile version"}
    "IdentityMfaStatus":
      "type": "object"
      "properties":
        "enabled": {"type": "boolean"}
      "required":
        - "enabled"
      "additionalProperties": false
    "IdentityMfaEnrollResult":
      "type": "object"
      "description": "One-time enrollment material. UniHub does not persist the secret, otpauth URL or recovery code."
      "properties":
        "secret": {"type": "string"}
        "otpauth_url": {"type": "string", "format": "uri"}
        "recovery_code": {"type": "string"}
        "enabled": {"const": false}
      "required":
        - "secret"
        - "otpauth_url"
        - "recovery_code"
        - "enabled"
      "additionalProperties": false
    "IdentityMfaConfirmRequest":
      "type": "object"
      "properties":
        "passcode": {"type": "string", "writeOnly": true}
        "secret": {"type": "string", "writeOnly": true}
        "recovery_code": {"type": "string", "writeOnly": true}
      "required":
        - "passcode"
        - "secret"
        - "recovery_code"
      "additionalProperties": false
    "IdentityMfaDisableRequest":
      "type": "object"
      "properties":
        "current_password": {"type": "string", "format": "password", "writeOnly": true}
        "passcode": {"type": "string", "writeOnly": true}
      "required":
        - "current_password"
        - "passcode"
      "additionalProperties": false
    "MfaAuthorizeRequest":
      "type": "object"
      "properties":
        "client_id": {"type": "string"}
        "mfa_token": {"type": "string", "minLength": 43, "maxLength": 43}
        "passcode": {"type": "string", "writeOnly": true}
      "required":
        - "client_id"
        - "mfa_token"
        - "passcode"
      "additionalProperties": false
    "IntegerString":
      "type": "string"
      "pattern": "^(0|[1-9][0-9]*)$"
      "description": "Canonical nonnegative decimal integer string; never a JSON number. CNY/6 cash and CREDIT/6 credits are distinct assets."
    "Error":
      "type": "object"
      "properties":
        "error":
          "type": "string"
        "interaction":
          "type": "object"
          "properties":
            "kind":
              "type": "string"
            "supported":
              "const": false
          "required":
            - "kind"
            - "supported"
          "additionalProperties": false
      "required":
        - "error"
      "additionalProperties": false
    "User":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "name":
          "type": "string"
        "email":
          "type": "string"
      "required":
        - "id"
        - "name"
        - "email"
      "additionalProperties": false
    "Account":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "kind":
          "enum":
            - "personal"
            - "team"
        "name":
