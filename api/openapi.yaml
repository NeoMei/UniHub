      "description": "Signed-in SuperWagie product-client discovery. Product and instance derive from the verified client registry; account access and selected funding policy are checked. Dynamic scope uses the current LLMRouter catalog. Explicit credits requires configured versioned conversion and runtime protocol support; omitted discovery funding uses the profile default. Selected scope retains central tariffs. No bearer or provider secret is returned."
