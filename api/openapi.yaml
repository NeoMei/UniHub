      "type": "object"
      "additionalProperties": false
      "required": ["error", "password_issues"]
      "properties":
        "error": {"const": "invalid_password"}
        "password_issues":
          "type": "array"
          "minItems": 1
          "items":
            "enum": ["too_short", "too_long", "too_many_bytes", "control_character", "letter_case_and_digit_required", "special_character_required", "repeated_character"]
