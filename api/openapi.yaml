          "$ref": "#/components/schemas/IntegerString"
        "scope":
          "$ref": "#/components/schemas/QueryScope"
        "filter":
          "$ref": "#/components/schemas/CallFilter"
        "financial_details":
          "type": "boolean"
        "by_status":
          "type": "object"
          "additionalProperties":
            "$ref": "#/components/schemas/IntegerString"
        "asset":
          "type": "string"
          "enum":
            - "CREDIT/6"
            - "CNY/6"
            - "mixed"
          "description": "Single matching asset or mixed when calls use both assets. mixed omits charged; use charges_by_asset without adding unlike assets."
        "usage":
          "$ref": "#/components/schemas/Usage"
        "usage_complete":
          "type": "boolean"
        "as_of":
          "type": "string"
          "format": "date-time"
        "accuracy":
          "const": "exact_for_query_snapshot"
        "consistency":
          "const": "live"
        "charges_by_asset":
          "type": "object"
          "properties":
            "CREDIT/6":
              "$ref": "#/components/schemas/IntegerString"
            "CNY/6":
              "$ref": "#/components/schemas/IntegerString"
          "additionalProperties": false
          "minProperties": 1
          "description": "Settled charges separately per matching asset. Present only for finance roles; pending/unknown holds are excluded."
      "required":
        - "calls_total"
        - "settled_calls"
        - "pending_calls"
        - "missing_usage_calls"
        - "unknown_calls"
        - "rejected_calls"
        - "released_calls"
        - "unknown_time"
        - "scope"
        - "filter"
        - "financial_details"
        - "by_status"
        - "asset"
        - "usage"
        - "usage_complete"
        - "as_of"
        - "accuracy"
        - "consistency"
      "additionalProperties": false
      "allOf":
        -
          "if":
            "properties":
              "asset":
                "const": "mixed"
            "required":
              - "asset"
          "then":
            "not":
              "required":
                - "charged"
        -
          "if":
            "properties":
              "financial_details":
                "const": false
            "required":
              - "financial_details"
          "then":
            "not":
              "anyOf":
                -
                  "required":
                    - "charged"
                -
                  "required":
                    - "charges_by_asset"
    "Resources":
      "type": "object"
      "properties":
        "account_id":
          "type": "string"
        "product_id":
          "type": "string"
        "subscriptions":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Subscription"
        "credits":
          "$ref": "#/components/schemas/CreditPool"
        "wallets":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Balance"
        "payments":
          "$ref": "#/components/schemas/Payments"
        "as_of":
          "type": "string"
          "format": "date-time"
        "billing_profile":
          "$ref": "#/components/schemas/BillingProfile"
          "description": "Optional origin product profile for a product access token. Console responses may omit it; use products or profile reads for other products."
      "required":
        - "account_id"
        - "product_id"
        - "subscriptions"
        - "payments"
        - "as_of"
      "additionalProperties": false
    "ModelCredential":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "audience":
          "const": "llmrouter"
        "actor_id":
          "type": "string"
        "account_id":
          "type": "string"
        "origin_product_id":
          "type": "string"
        "models":
          "type": "array"
          "items":
            "type": "string"
        "task_id":
          "type": "string"
        "expires_at":
          "type": "string"
          "format": "date-time"
        "token":
          "type": "string"
        "funding_mode":
          "$ref": "#/components/schemas/FundingMode"
        "asset":
          "$ref": "#/components/schemas/BillingAsset"
        "billing_profile_version":
          "type": "integer"
          "format": "int64"
          "minimum": 0
      "required":
        - "id"
        - "audience"
        - "actor_id"
        - "account_id"
        - "origin_product_id"
        - "models"
        - "task_id"
        - "expires_at"
        - "token"
        - "funding_mode"
        - "asset"
        - "billing_profile_version"
      "additionalProperties": false
    "BillingAsset":
      "type": "string"
      "enum":
        - "CREDIT/6"
        - "CNY/6"
      "description": "One asset per call. Both have scale 6; CREDIT is not CNY and there is no automatic conversion or fallback."
    "FundingMode":
      "type": "string"
      "enum":
        - "credits"
        - "prepaid_cash"
      "description": "credits uses CREDIT/6; prepaid_cash uses only the billed account llmrouter product wallet in CNY/6."
    "BillingComponent":
      "type": "object"
      "properties":
        "enabled":
          "type": "boolean"
      "required":
        - "enabled"
      "additionalProperties": false
    "ModelConsistency":
      "type": "object"
      "properties":
        "product_id":
          "type": "string"
        "asset":
          "$ref": "#/components/schemas/BillingAsset"
        "allowlist":
          "type": "array"
          "items": {"type": "string"}
          "description": "Sorted configured models. An empty projection may represent either the legacy null policy or an explicit empty policy; inspect BillingProfile.usage.models to distinguish them."
        "published_rates":
          "type": "array"
          "items": {"$ref": "#/components/schemas/Rate"}
        "missing_models":
          "type": "array"
          "items": {"type": "string"}
        "extra_models":
          "type": "array"
          "items": {"type": "string"}
        "duplicate_models":
          "type": "array"
          "items": {"type": "string"}
      "required": ["product_id", "asset", "allowlist", "published_rates", "missing_models", "extra_models", "duplicate_models"]
      "additionalProperties": false
    "UsagePolicy":
      "type": "object"
      "properties":
        "models":
          "type": ["array", "null"]
          "items":
            "type": "string"
            "minLength": 1
            "maxLength": 128
          "maxItems": 32
          "uniqueItems": true
          "description": "Product model allowlist. Omitted or null retains the legacy catalog; an explicit empty array denies all models. New credentials require exactly one published rate per requested model in the selected asset."
        "enabled":
          "type": "boolean"
        "require_subscription":
          "type": "boolean"
        "funding_modes":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FundingMode"
          "uniqueItems": true
        "default_funding_mode":
          "type": "string"
          "enum":
            - ""
            - "credits"
            - "prepaid_cash"
      "required":
        - "enabled"
        - "require_subscription"
        - "funding_modes"
        - "default_funding_mode"
      "additionalProperties": false
      "description": "Enabled usage requires an allowed default mode. Disabled usage requires an empty modes array, empty default and require_subscription=false. A subscription requirement requires subscription.enabled."
    "BillingProfile":
      "type": "object"
      "properties":
        "product_id":
          "type": "string"
          "pattern": "^[a-z][a-z0-9_-]{0,63}$"
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "description": "Read version. PUT sends the current expected version and returns version+1. Deployment file versions start at 1."
        "subscription":
          "$ref": "#/components/schemas/BillingComponent"
        "included_credits":
          "$ref": "#/components/schemas/BillingComponent"
        "addons":
          "$ref": "#/components/schemas/BillingComponent"
        "usage":
          "$ref": "#/components/schemas/UsagePolicy"
      "required":
        - "product_id"
        - "version"
        - "subscription"
        - "included_credits"
        - "addons"
        - "usage"
      "additionalProperties": false
      "description": "Commercial policy shared by all clients of one product, independent of identity client configuration. included_credits needs subscriptions and credits mode; addons needs credits mode. Prices, periods and immutable grant terms remain in Offers. Unconfigured products retain version-zero hybrid."
    "BillingPresets":
      "type": "object"
      "properties":
        "hybrid":
          "$ref": "#/components/schemas/BillingProfile"
        "prepaid":
          "$ref": "#/components/schemas/BillingProfile"
        "subscription":
          "$ref": "#/components/schemas/BillingProfile"
      "required":
        - "hybrid"
        - "prepaid"
        - "subscription"
      "additionalProperties": false
      "description": "Templates only: product_id=template and version=0. Replace product and choose an explicit version to prepare a deployment policy; presets do not publish prices or save profiles."
    "MeteringQuantity": {"type": "object", "properties": {"value": {"type": "string", "pattern": "^(0|[1-9][0-9]{0,37})$"}, "scale": {"type": "integer", "minimum": 0, "maximum": 9}}, "required": ["value", "scale"], "additionalProperties": false}
    "MeteringRational": {"type": "object", "properties": {"numerator": {"type": "string"}, "denominator": {"type": "string"}}, "required": ["numerator", "denominator"], "additionalProperties": false}
    "MeteringMeasurement": {"type": "object", "properties": {"key": {"type": "string"}, "unit": {"type": "string", "enum": ["token", "character", "audio_second", "image", "request", "video_second", "provider_unit"]}, "provider_unit": {"type": "string"}, "quantity": {"$ref": "#/components/schemas/MeteringQuantity"}}, "required": ["key", "unit", "quantity"], "additionalProperties": false}
    "MeteringTerm": {"type": "object", "properties": {"key": {"type": "string"}, "unit": {"type": "string", "enum": ["token", "character", "audio_second", "image", "request", "video_second", "provider_unit"]}, "provider_unit": {"type": "string"}, "price": {"$ref": "#/components/schemas/MeteringRational"}, "step": {"$ref": "#/components/schemas/MeteringQuantity"}, "minimum": {"$ref": "#/components/schemas/MeteringQuantity"}}, "required": ["key", "unit", "price"], "additionalProperties": false}
    "MeteringPrice": {"type": "object", "properties": {"version": {"const": "metered_v2"}, "operation": {"type": "string"}, "policy": {"type": "string"}, "terms": {"type": "array", "minItems": 1, "maxItems": 64, "items": {"$ref": "#/components/schemas/MeteringTerm"}}}, "required": ["version", "operation", "policy", "terms"], "additionalProperties": false}
    "MeteringUsage": {"type": "object", "properties": {"version": {"const": "metered_v2"}, "operation": {"type": "string"}, "state": {"enum": ["confirmed", "missing", "invalid", "incomplete"]}, "source": {"type": "string"}, "measurements": {"type": "array", "items": {"$ref": "#/components/schemas/MeteringMeasurement"}}, "provider_request_id": {"type": "string"}}, "required": ["version", "operation", "state", "source", "measurements"], "additionalProperties": false}
    "Rate": {"type": "object", "properties": {"asset": {"enum": ["CNY/6", "CREDIT/6"]}, "id": {"type": "string"}, "model": {"type": "string"}, "status": {"type": "string"}, "semantics": {"enum": ["exclusive_v1", "metered_v2"]}, "input": {"$ref": "#/components/schemas/MeteringRational"}, "output": {"$ref": "#/components/schemas/MeteringRational"}, "cache_read": {"$ref": "#/components/schemas/MeteringRational"}, "cache_write": {"$ref": "#/components/schemas/MeteringRational"}, "reasoning": {"$ref": "#/components/schemas/MeteringRational"}, "metered": {"$ref": "#/components/schemas/MeteringPrice"}}, "required": ["asset", "id", "model", "status", "semantics"], "additionalProperties": false}
    "NativeUsageTotal": {"type": "object", "properties": {"operation": {"type": "string"}, "measurements": {"type": "array", "items": {"$ref": "#/components/schemas/MeteringMeasurement"}}}, "required": ["operation", "measurements"], "additionalProperties": false}

    "ProductAccess": {"type": "object", "required": ["issuer", "subject", "product_id", "instance_id", "user", "roles", "permissions", "version", "active", "expires_at"], "properties": {"issuer": {"type": "string", "format": "uri"}, "subject": {"type": "string"}, "product_id": {"type": "string"}, "instance_id": {"type": "string"}, "user": {"$ref": "#/components/schemas/User"}, "roles": {"type": "array", "items": {"type": "string"}}, "permissions": {"type": "array", "items": {"type": "string"}}, "version": {"type": "integer", "minimum": 1}, "active": {"type": "boolean"}, "expires_at": {"type": "integer", "description": "Verified upstream expiry, Unix seconds"}}}

    "ProductAssignment": {"type": "object", "required": ["product_id", "instance_id", "roles", "active", "assignment_version", "manifest_version", "explicit"], "properties": {"product_id": {"type": "string"}, "instance_id": {"type": "string"}, "roles": {"type": "array", "items": {"type": "string"}}, "active": {"type": "boolean"}, "assignment_version": {"type": "integer", "minimum": 0}, "manifest_version": {"type": "integer", "minimum": 1}, "explicit": {"type": "boolean"}}}

    "ManagedUser": {"type": "object", "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "email": {"type": "string"}, "active": {"type": "boolean"}, "version": {"type": "integer", "minimum": 1}}}

    "ProductRole": {"type": "object", "required": ["id", "name", "permissions"], "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "permissions": {"type": "array", "items": {"type": "string"}}, "privileged": {"type": "boolean", "default": false}}}

    "ProductManifest": {"type": "object", "required": ["product_id", "instance_id", "name", "entry_url", "version", "default_roles", "roles"], "properties": {"product_id": {"type": "string"}, "instance_id": {"type": "string"}, "name": {"type": "string"}, "entry_url": {"type": "string", "format": "uri"}, "version": {"type": "integer", "minimum": 1}, "default_roles": {"type": "array", "items": {"type": "string"}}, "roles": {"type": "array", "items": {"$ref": "#/components/schemas/ProductRole"}}}}

    "Application": {"allOf": [{"$ref": "#/components/schemas/ProductAccess"}, {"type": "object", "properties": {"name": {"type": "string"}, "entry_url": {"type": "string", "format": "uri"}}}]}
