      "enum": ["CREDIT/6", "CNY/6", "LR_QUOTA/0"]
      "description": "Report assets stay separate; legacy native quota is not converted to cash or central model credits."
    "BillingAsset":
      "type": "string"
      "enum":
        - "CREDIT/6"
        - "CNY/6"
      "description": "One asset per call. Both have scale 6; CREDIT is not CNY and there is no automatic conversion or fallback."
    "FundingMode":
      "type": "string"
      "enum":
        - "credits"
        - "prepaid_cash"
      "description": "credits uses CREDIT/6; prepaid_cash uses only the billed account llmrouter product wallet in CNY/6."
