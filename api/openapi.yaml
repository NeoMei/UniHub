          "type": "array"
          "items": {"type": "string"}
      "required": ["product_id", "asset", "allowlist", "published_rates", "missing_models", "extra_models", "duplicate_models"]
      "additionalProperties": false
    "UsagePolicy":
      "type": "object"
      "properties":
        "models":
          "type": ["array", "null"]
          "items":
            "type": "string"
            "minLength": 1
            "maxLength": 128
          "maxItems": 32
          "uniqueItems": true
          "description": "Product model allowlist. Omitted or null retains the legacy catalog; an explicit empty array denies all models. New credentials require exactly one published rate per requested model in the selected asset."
        "enabled":
          "type": "boolean"
        "require_subscription":
          "type": "boolean"
        "require_subscription_for_credits":
          "type": "boolean"
          "default": false
          "description": "Requires membership for CREDIT use while preserving cash behavior when the global membership flag is false. Does not override global require_subscription."
        "funding_modes":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FundingMode"
          "uniqueItems": true
        "default_funding_mode":
          "type": "string"
          "enum":
            - ""
            - "credits"
            - "prepaid_cash"
      "required":
        - "enabled"
        - "require_subscription"
        - "funding_modes"
        - "default_funding_mode"
      "additionalProperties": false
      "description": "Enabled usage requires an allowed default mode. Disabled usage requires an empty modes array, empty default and both subscription flags false. Either subscription requirement requires subscription.enabled."
    "NativeCreditConversion":
      "type": "object"
      "additionalProperties": false
      "required": ["version", "numerator", "denominator", "rounding"]
      "properties":
        "version": {"type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$","description":"Immutable tariff identifier; changing a ratio requires a new version. Reserved cash conversion version is not valid."}
        "numerator": {"type":"string","pattern":"^[1-9][0-9]{0,18}$","description":"Positive int64 CREDIT/6 micro-units numerator per native quota unit."}
        "denominator": {"type":"string","pattern":"^[1-9][0-9]{0,18}$","description":"Positive int64 divisor."}
        "rounding": {"const":"lr-cumulative-ceil-v1"}
    "BillingProfile":
      "type": "object"
      "properties":
        "product_id":
          "type": "string"
          "pattern": "^[a-z][a-z0-9_-]{0,63}$"
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "description": "Read version. PUT sends the current expected version and returns version+1. Deployment file versions start at 1."
        "subscription":
          "$ref": "#/components/schemas/BillingComponent"
        "included_credits":
          "$ref": "#/components/schemas/BillingComponent"
        "addons":
          "$ref": "#/components/schemas/BillingComponent"
        "usage":
          "$ref": "#/components/schemas/UsagePolicy"
        "native_credit_conversion":
          "anyOf": [{"$ref":"#/components/schemas/NativeCreditConversion"},{"type":"null"}]
      "required":
        - "product_id"
        - "version"
        - "subscription"
        - "included_credits"
        - "addons"
        - "usage"
      "additionalProperties": false
      "description": "Commercial policy shared by all clients of one product, independent of identity client configuration. included_credits needs subscriptions and credits mode; addons needs credits mode. Prices, periods and immutable grant terms remain in Offers. Unconfigured products retain version-zero hybrid."
    "BillingPresets":
      "type": "object"
      "properties":
        "hybrid":
          "$ref": "#/components/schemas/BillingProfile"
        "prepaid":
          "$ref": "#/components/schemas/BillingProfile"
        "subscription":
          "$ref": "#/components/schemas/BillingProfile"
      "required":
        - "hybrid"
        - "prepaid"
        - "subscription"
      "additionalProperties": false
      "description": "Templates only: product_id=template and version=0. Replace product and choose an explicit version to prepare a deployment policy; presets do not publish prices or save profiles."
    "MeteringQuantity": {"type": "object", "properties": {"value": {"type": "string", "pattern": "^(0|[1-9][0-9]{0,37})$"}, "scale": {"type": "integer", "minimum": 0, "maximum": 9}}, "required": ["value", "scale"], "additionalProperties": false}
    "MeteringRational": {"type": "object", "properties": {"numerator": {"type": "string"}, "denominator": {"type": "string"}}, "required": ["numerator", "denominator"], "additionalProperties": false}
    "MeteringMeasurement": {"type": "object", "properties": {"key": {"type": "string"}, "unit": {"type": "string", "enum": ["token", "character", "audio_second", "image", "request", "video_second", "provider_unit"]}, "provider_unit": {"type": "string"}, "quantity": {"$ref": "#/components/schemas/MeteringQuantity"}}, "required": ["key", "unit", "quantity"], "additionalProperties": false}
    "MeteringTerm": {"type": "object", "properties": {"key": {"type": "string"}, "unit": {"type": "string", "enum": ["token", "character", "audio_second", "image", "request", "video_second", "provider_unit"]}, "provider_unit": {"type": "string"}, "price": {"$ref": "#/components/schemas/MeteringRational"}, "step": {"$ref": "#/components/schemas/MeteringQuantity"}, "minimum": {"$ref": "#/components/schemas/MeteringQuantity"}}, "required": ["key", "unit", "price"], "additionalProperties": false}
    "MeteringPrice": {"type": "object", "properties": {"version": {"const": "metered_v2"}, "operation": {"type": "string"}, "policy": {"type": "string"}, "terms": {"type": "array", "minItems": 1, "maxItems": 64, "items": {"$ref": "#/components/schemas/MeteringTerm"}}}, "required": ["version", "operation", "policy", "terms"], "additionalProperties": false}
