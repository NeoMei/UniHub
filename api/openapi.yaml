          "name": "product"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "pattern": "^[a-z][a-z0-9_-]{0,63}$"
    "put":
      "operationId": "setBillingProfile"
      "summary": "setBillingProfile"
      "description": "Append a profile version using the body version as the expected current version. Body product_id must match the path; successful write returns version+1. Stale versions return 409. Operator token plus configured operator allowlist required. No automatic retries after an unknown outcome: read back and compare before deciding the next action."
      "security":
        -
          "OperatorBearerAuth": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BillingProfile"
        "400":
