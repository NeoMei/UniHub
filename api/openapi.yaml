        "rejected_calls":
          "$ref": "#/components/schemas/IntegerString"
        "released_calls":
          "$ref": "#/components/schemas/IntegerString"
        "charged":
          "$ref": "#/components/schemas/IntegerString"
          "description": "Settled amount only for a single matching asset and finance roles. Omitted for mixed assets or non-finance roles."
        "unknown_time":
          "$ref": "#/components/schemas/IntegerString"
        "scope":
          "$ref": "#/components/schemas/QueryScope"
        "filter":
          "$ref": "#/components/schemas/CallFilter"
        "financial_details":
          "type": "boolean"
        "by_status":
          "type": "object"
          "additionalProperties":
            "$ref": "#/components/schemas/IntegerString"
        "asset":
          "type": "string"
          "enum":
            - "CREDIT/6"
            - "CNY/6"
            - "mixed"
          "description": "Single matching asset or mixed when calls use both assets. mixed omits charged; use charges_by_asset without adding unlike assets."
        "usage":
          "$ref": "#/components/schemas/Usage"
        "usage_complete":
          "type": "boolean"
        "as_of":
          "type": "string"
          "format": "date-time"
        "accuracy":
          "const": "exact_for_query_snapshot"
        "consistency":
          "const": "live"
        "charges_by_asset":
          "type": "object"
          "properties":
            "CREDIT/6":
              "$ref": "#/components/schemas/IntegerString"
            "CNY/6":
              "$ref": "#/components/schemas/IntegerString"
          "additionalProperties": false
          "minProperties": 1
          "description": "Settled charges separately per matching asset. Present only for finance roles; pending/unknown holds are excluded."
      "required":
        - "calls_total"
        - "settled_calls"
        - "pending_calls"
        - "missing_usage_calls"
        - "unknown_calls"
        - "rejected_calls"
        - "released_calls"
        - "unknown_time"
        - "scope"
        - "filter"
        - "financial_details"
        - "by_status"
        - "asset"
        - "usage"
        - "usage_complete"
        - "as_of"
        - "accuracy"
        - "consistency"
      "additionalProperties": false
      "allOf":
        -
          "if":
            "properties":
              "asset":
                "const": "mixed"
            "required":
              - "asset"
          "then":
            "not":
              "required":
                - "charged"
        -
          "if":
            "properties":
              "financial_details":
                "const": false
            "required":
              - "financial_details"
          "then":
            "not":
              "anyOf":
                -
                  "required":
                    - "charged"
                -
                  "required":
                    - "charges_by_asset"
