      "type": "object"
      "properties":
        "authorization_id":
          "type": "string"
        "code":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
        "state":
          "type": "string"
        "expires_in":
          "type": "integer"
      "required":
        - "authorization_id"
        - "code"
        - "state"
