"components":
  "securitySchemes":
    "BearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "OIDC access token"
      "description": "Exact distinct client audience; console/ops/service audiences separate. Scope requirements are x-product-scopes registry upper bounds AND domain RBAC."
    "OperatorBearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "Operator OIDC access token"
      "description": "Distinct operator audience verified separately from product/console tokens. A write also requires the configured operator allowlist. Never embed an operator token in a product UI, configuration file or URL."
  "parameters":
    "IdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "minLength": 1
        "maxLength": 128
      "description": "Caller-generated stable key; preserve original key/result after ambiguity. Never automatically retry using a new key."
  "responses":
    "Error":
      "description": "Structured failure: 400 invalid_request/invalid_grant; 401 unauthenticated; 402 insufficient funds/credits; 403 forbidden; 404 unavailable object; 409 conflict/operation_pending/refund_requires_review/interaction_required; 429 rate_limited; 503 unavailable/payment_not_configured/authorization_result_unknown. Uncertainty is not success."
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
  "schemas":
    "IntegerString":
      "type": "string"
      "pattern": "^(0|[1-9][0-9]*)$"
      "description": "Canonical nonnegative decimal integer string; never a JSON number. CNY/6 cash and CREDIT/6 credits are distinct assets."
    "Error":
      "type": "object"
      "properties":
        "error":
          "type": "string"
        "interaction":
          "type": "object"
          "properties":
            "kind":
              "type": "string"
            "supported":
              "const": false
          "required":
            - "kind"
            - "supported"
          "additionalProperties": false
      "required":
        - "error"
      "additionalProperties": false
    "User":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "name":
          "type": "string"
        "email":
          "type": "string"
      "required":
        - "id"
        - "name"
        - "email"
      "additionalProperties": false
    "Account":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "kind":
          "enum":
            - "personal"
            - "team"
        "name":
          "type": "string"
        "role":
          "enum":
            - "owner"
            - "admin"
            - "billing_admin"
            - "member"
      "required":
        - "id"
        - "kind"
        - "name"
        - "role"
      "additionalProperties": false
    "Member":
      "type": "object"
      "properties":
        "user_id":
          "type": "string"
        "name":
          "type": "string"
        "email":
          "type": "string"
        "role":
          "type": "string"
      "required":
        - "user_id"
        - "name"
        - "email"
        - "role"
      "additionalProperties": false
    "Invitation":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "account_id":
          "type": "string"
        "recipient_id":
          "type": "string"
        "role":
          "type": "string"
      "required":
        - "id"
        - "account_id"
        - "recipient_id"
        - "role"
      "additionalProperties": false
    "Product":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "name":
          "type": "string"
        "billing_profile":
          "$ref": "#/components/schemas/BillingProfile"
      "required":
        - "id"
        - "name"
      "additionalProperties": false
    "Balance":
      "type": "object"
      "properties":
        "product_id":
          "type": "string"
        "asset":
          "const": "CNY/6"
        "amount":
          "$ref": "#/components/schemas/IntegerString"
      "required":
        - "product_id"
        - "asset"
        - "amount"
      "additionalProperties": false
      "example":
        "product_id": "llmrouter"
        "asset": "CNY/6"
        "amount": "10000000"
    "Operation":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "account_id":
          "type": "string"
        "kind":
          "type": "string"
        "status":
          "enum":
            - "CREATED"
            - "SUBMITTING"
            - "UNKNOWN"
            - "APPLIED"
            - "REJECTED"
            - "CANCELED"
        "ledger_transaction_id":
          "type": "string"
        "error_code":
          "type": "string"
        "created_at":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "account_id"
        - "kind"
        - "status"
        - "created_at"
      "additionalProperties": false
    "Recharge":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "account_id":
          "type": "string"
        "product_id":
          "type": "string"
        "amount":
          "$ref": "#/components/schemas/IntegerString"
        "currency":
          "type": "string"
        "merchant":
          "type": "string"
        "operation_id":
          "type": "string"
      "required":
        - "id"
        - "account_id"
        - "product_id"
        - "amount"
        - "currency"
        - "merchant"
      "additionalProperties": false
    "RegistrationRequest":
      "type": "object"
      "properties":
        "client_id":
          "type": "string"
        "username":
          "type": "string"
          "pattern": "^[a-z][a-z0-9_-]{1,63}$"
        "password":
          "type": "string"
          "format": "password"
          "minLength": 12
          "maxLength": 128
          "description": "At least 12 characters, ASCII upper/lower/digit; UTF-8 total <=72 bytes for reviewed bcrypt policy. No username/email-local reuse. Current organization rules apply."
          "writeOnly": true
        "email":
          "type": "string"
        "display_name":
          "type": "string"
          "maxLength": 80
      "required":
        - "client_id"
        - "username"
        - "password"
      "additionalProperties": false
    "RegistrationResult":
      "type": "object"
      "properties":
        "registration_id":
          "type": "string"
        "status":
          "enum":
            - "CREATED"
            - "UNKNOWN"
        "login_required":
          "type": "boolean"
        "retry_after":
          "type": "integer"
      "required":
        - "registration_id"
        - "status"
      "additionalProperties": false
    "PasswordAuthorizeRequest":
      "type": "object"
      "properties":
        "client_id":
          "type": "string"
        "redirect_uri":
          "type": "string"
          "format": "uri"
        "scope":
          "const": "openid profile email"
        "state":
          "type": "string"
          "minLength": 32
          "maxLength": 256
        "nonce":
          "type": "string"
          "minLength": 32
          "maxLength": 256
        "code_challenge_method":
          "const": "S256"
        "code_challenge":
