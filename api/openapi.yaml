      "operationId": "issueModelCredential"
      "summary": "issueModelCredential"
      "description": "Origin defaults to verified product; mismatch denied. Current account membership, product usage policy, optional subscription gate and a published rate in the selected asset are required. Omitted funding_mode uses the profile default; explicit modes must be allowed. No credits-to-cash fallback. Short-lived llmrouter capability only, never a user login or settlement credential."
