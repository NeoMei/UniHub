          "enum":
            - "authorization_code"
            - "refresh_token"
        "authorization_id":
          "type": "string"
          "minLength": 43
          "maxLength": 43
        "client_id":
          "type": "string"
        "redirect_uri":
          "type": "string"
          "format": "uri"
        "code":
          "type": "string"
        "code_verifier":
          "type": "string"
          "pattern": "^[A-Za-z0-9._~-]{43,128}$"
        "refresh_token":
          "type": "string"
          "minLength": 32
          "maxLength": 128
      "required":
        - "grant_type"
        - "client_id"
      "additionalProperties": false
      "oneOf":
        - "required":
            - "authorization_id"
            - "redirect_uri"
            - "code"
            - "code_verifier"
          "not":
            "required":
              - "refresh_token"
        - "required":
            - "refresh_token"
          "not":
            "required":
              - "authorization_id"
