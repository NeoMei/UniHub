      "type": "object"
      "properties":
        "enabled":
          "type": "boolean"
      "required":
        - "enabled"
      "additionalProperties": false
    "ModelConsistency":
      "type": "object"
      "properties":
        "product_id":
          "type": "string"
        "asset":
          "$ref": "#/components/schemas/BillingAsset"
        "allowlist":
          "type": "array"
          "items": {"type": "string"}
          "description": "Sorted configured models. An empty projection may represent either the legacy null policy or an explicit empty policy; inspect BillingProfile.usage.models to distinguish them."
        "published_rates":
          "type": "array"
          "items": {"$ref": "#/components/schemas/Rate"}
        "missing_models":
          "type": "array"
          "items": {"type": "string"}
