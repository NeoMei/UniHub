"openapi": "3.1.0"
"info":
  "title": "UniHub Headless Product API"
  "version": "0.4.18"
  "description": "Product-owned JSON UI and backend integration. Each client has its own exact access-token audience and approved registry scopes/origins/callbacks/BillingProducts. Scopes are server registry policy, not OAuth token-scope claims. Amounts/counts/usage are integer strings; no implicit currency/credit conversion. Formance is authoritative. No automatic financial retries. API errors never expose provider credentials. Browser CORS exact registered origins; no Allow-Credentials; preflight permits only Authorization, Content-Type, Idempotency-Key. No public GET client configuration, refresh or server logout endpoint currently exists. Billing profiles compose subscriptions, credits, addons and prepaid CNY/6 usage per product. Product reads never permit commercial configuration writes; operator audience is separate. Mixed-asset summaries have no single charged total."
"servers":
  -
    "url": "http://127.0.0.1:8088"
    "description": "Local development; use deployment HTTPS service origin in production"
"security":
  -
    "BearerAuth": []
"paths":
  "/v1/me/product-access":
    "get": {"operationId": "productAccess", "description": "Verified product access:read or console; product/instance derive from client policy.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductAccess"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "product_id", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "instance", "in": "query", "required": false, "schema": {"type": "string"}}]}
  "/v1/me/applications":
    "get": {"operationId": "applications", "description": "Available product launch URLs and current access; product clients see only their instance.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Application"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  "/v1/user-management":
    "get": {"operationId": "userManagement", "description": "Console identity only; immutable USER_ADMIN_IDS gate.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "object", "properties": {"enabled": {"type": "boolean"}, "can_manage": {"type": "boolean"}}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  "/v1/user-management/users":
    "get": {"operationId": "managedUsers", "description": "Configured user administrator only; bounded directory search.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ManagedUser"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "q", "in": "query", "required": false, "schema": {"type": "string"}}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]}
  "/v1/user-management/products":
    "get": {"operationId": "userProducts", "description": "Configured user administrator only; billing-independent manifests.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ProductManifest"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  "/v1/user-management/users/{user}/access":
    "get": {"operationId": "userAccess", "description": "Configured user administrator only; explicit assignment version distinct from manifest version.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ProductAssignment"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "user", "in": "path", "required": true, "schema": {"type": "string"}}]}
  "/v1/user-management/users/{user}/access/{product}":
    "put": {"operationId": "setUserAccess", "description": "Console administrator only; CSRF-protected browser write. Body version is assignment_version, initially 0; transaction/audit with stale version 409.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductAssignment"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "user", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "product", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "instance", "in": "query", "required": false, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["roles", "active", "version"], "additionalProperties": false, "properties": {"roles": {"type": "array", "items": {"type": "string"}}, "active": {"type": "boolean"}, "version": {"type": "integer", "minimum": 0}}}}}}}
  "/v1/user-management/users/{user}/status":
    "put": {"operationId": "setUserStatus", "description": "Console administrator only; global active status CAS. Refuses disabling last configured available user admin.", "responses": {"200": {"description": "Successful response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ManagedUser"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}, "parameters": [{"name": "user", "in": "path", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["active", "version"], "additionalProperties": false, "properties": {"active": {"type": "boolean"}, "version": {"type": "integer", "minimum": 1}}}}}}}
  "/v1/identity/registrations":
    "post":
      "operationId": "registerIdentity"
      "summary": "registerIdentity"
      "description": "Requires explicitly enabled client registration. 202 UNKNOWN is unresolved, not registered. Repeat the SAME key and nonsecret metadata only to reconcile; never auto-create using a new key. Registration 429 includes Retry-After and retry_after seconds until the current hourly limit resets. registration_not_started=true applies only to this client/key at the server decision; it never clears a previously UNKNOWN result. Existing saved operations reconcile before rate limiting. Passwords go only to IdP and are never stored in UniHub."
      "security": []
      "responses":
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "description": "Registration attempt rejected before saving an operation for this client/key"
          "headers":
            "Retry-After":
              "description": "Remaining fixed-window wait in seconds, rounded up"
              "schema":
                "type": "integer"
                "minimum": 1
                "maximum": 3600
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationRateLimited"
        "503":
          "$ref": "#/components/responses/Error"
        "200":
          "description": "Idempotent readback"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "202":
          "description": "Registration outcome UNKNOWN"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RegistrationResult"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "parameters":
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegistrationRequest"
  "/v1/identity/authorize/password":
    "post":
      "operationId": "authorizePassword"
      "summary": "authorizePassword"
      "description": "Product-owned JSON password authorization with S256/state/nonce. Exact registered client, callback and browser Origin. Interaction-required MFA/consent/policy returns 409, never bypassed."
      "security": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PasswordAuthorizeResult"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PasswordAuthorizeRequest"
  "/v1/identity/authorize/mfa":
    "post":
      "operationId": "authorizeMfa"
      "summary": "authorizeMfa"
      "description": "Continues a password authorization that returned mfa_pending: one short-lived mfa_token plus the current TOTP passcode. Single-use, five-minute window with a five-attempt budget per token; browser Origin rules match password authorization."
      "security": []
      "responses":
        "200":
          "description": "Successful response; same binding as password authorization"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PasswordAuthorizeResult"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/MfaAuthorizeRequest"
  "/v1/identity/token":
    "post":
      "operationId": "exchangeAuthorizationCode"
      "summary": "exchangeAuthorizationCode"
      "description": "Single-use, five-minute authorization bound to exact client/redirect/code/verifier. Lost provider result returns authorization_result_unknown; no automatic retry. No refresh token or server logout API."
      "security": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TokenSet"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
        "405":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "502":
          "$ref": "#/components/responses/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/TokenRequest"
  "/v1/me/profile":
    "get":
      "operationId": "getIdentityProfile"
      "description": "Sandbox self profile; accounts:read required. Login username is immutable. Responses are no-store."
      "responses":
        "200":
          "description": "Current profile"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IdentityProfile"
        "401":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
    "patch":
      "operationId": "updateIdentityDisplayName"
      "description": "Sandbox; profile:write required. Only display_name is accepted, up to 80 Unicode characters; empty clears it."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "additionalProperties": false
              "required": ["display_name"]
              "properties":
                "display_name": {"type": "string", "maxLength": 80}
      "responses":
        "200":
          "description": "Updated profile"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IdentityProfile"
        "400":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/v1/me/mfa":
    "get":
      "operationId": "getIdentityMfaStatus"
      "description": "Sandbox; central identity only. Reports whether TOTP second factor is enabled at Casdoor. Product-owned credentials return credentials_managed_by_product."
      "responses":
        "200":
          "description": "Current TOTP status"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IdentityMfaStatus"
        "401":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/v1/me/mfa/enroll":
    "post":
      "operationId": "enrollIdentityMfa"
      "description": "Sandbox; central identity only. Begins TOTP enrollment at Casdoor and returns the one-time secret, otpauth URL and recovery code. UniHub never stores them. Already enabled returns 409."
      "responses":
        "200":
          "description": "Pending enrollment material"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IdentityMfaEnrollResult"
        "401":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/v1/me/mfa/confirm":
    "post":
      "operationId": "confirmIdentityMfa"
      "description": "Sandbox; central identity only. Verifies one passcode against the pending secret, enables TOTP at Casdoor and writes audit_events. Never stores the secret or recovery code."
      "requestBody":
        "required": true,
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/IdentityMfaConfirmRequest"
      "responses":
        "200":
          "description": "TOTP enabled"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IdentityMfaStatus"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/v1/me/mfa/disable":
    "post":
      "operationId": "disableIdentityMfa"
      "description": "Sandbox; central identity only. Requires the current password and one valid passcode before deleting TOTP at Casdoor; writes audit_events."
      "requestBody":
        "required": true,
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/IdentityMfaDisableRequest"
      "responses":
        "200":
          "description": "TOTP disabled"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IdentityMfaStatus"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/v1/me/password":
    "post":
      "operationId": "changeIdentityPassword"
      "description": "Sandbox; profile:write required. Verifies current password and provider policy. Success revokes provider tokens and matching UniHub browser sessions; sign in again. Never automatically retry an uncertain result."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "additionalProperties": false
              "required": ["current_password", "new_password"]
              "properties":
                "current_password": {"type": "string", "writeOnly": true}
                "new_password": {"type": "string", "writeOnly": true}
      "responses":
        "204": {"description": "Password changed; sign in again"}
        "400":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  "/v1/me/avatar":
    "get":
      "operationId": "getIdentityAvatar"
      "description": "Sandbox; authenticated accounts:read required. Returns stored normalized PNG, never a public URL."
      "responses":
        "200":
          "description": "Private PNG; no-store"
          "content":
            "image/png":
              "schema": {"type": "string", "format": "binary"}
        "401":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
    "put":
      "operationId": "putIdentityAvatar"
      "description": "Sandbox; profile:write required. JSON <=1 MiB. Decoded PNG/JPEG and normalized PNG <=512 KiB, dimensions <=1024x1024. URL, SVG and WebP input rejected."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "additionalProperties": false
              "required": ["content_type", "data_base64"]
              "properties":
                "content_type": {"type": "string", "enum": ["image/png", "image/jpeg"]}
                "data_base64": {"type": "string", "format": "byte"}
      "responses":
        "200":
          "description": "Updated profile"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IdentityProfile"
        "400":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
  "/v1/me":
    "get":
      "operationId": "me"
      "summary": "me"
      "description": "Verifies an access token and lazily establishes issuer+subject identity. identity:read also permits this route."
      "security":
        -
          "BearerAuth": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
      "x-product-scopes":
        - "accounts:read"
  "/v1/capabilities":
    "get":
      "operationId": "capabilities"
      "summary": "capabilities"
      "description": "Registry capability upper bound; does not replace per-account RBAC."
      "security":
        -
          "BearerAuth": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Capabilities"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
      "x-product-scopes":
        - "accounts:read"
  "/v1/accounts":
    "get":
      "operationId": "accounts"
      "summary": "accounts"
      "description": ""
      "security":
        -
          "BearerAuth": []
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/Account"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
      "x-product-scopes":
        - "accounts:read"
    "post":
      "operationId": "createTeam"
      "summary": "createTeam"
      "description": ""
      "security":
        -
          "BearerAuth": []
      "responses":
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Account"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
      "x-product-scopes":
        - "accounts:write"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "name":
                  "type": "string"
              "required":
                - "name"
              "additionalProperties": false
  "/v1/accounts/{account}/members":
    "get":
      "operationId": "members"
      "summary": "members"
      "description": ""
      "security":
        -
          "BearerAuth": []
      "responses":
        "200":
