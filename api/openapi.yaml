      "type": "object"
      "properties":
        "calls_total":
          "$ref": "#/components/schemas/IntegerString"
        "settled_calls":
          "$ref": "#/components/schemas/IntegerString"
        "pending_calls":
          "$ref": "#/components/schemas/IntegerString"
