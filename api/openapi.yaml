  "/v1/models":
    "get":
      "operationId": "listScopedModels"
      "summary": "listScopedModels"
      "description": "OpenAI-compatible model discovery for a durable UniHub API key. The key's immutable product, instance, account, model allowlist and current published rates are revalidated. The bearer is never returned; account scope is exposed only through non-secret response headers. Optional X-UniHub-Product and X-UniHub-Instance headers must exactly match the key.
